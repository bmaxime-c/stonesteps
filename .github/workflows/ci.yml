name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Le build a besoin de variables presentes, pas valides : aucun appel
      # reseau vers Supabase n'est fait a la compilation.
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le verrou est genere sous Windows, ou npm n'inscrit que les binaires
      # natifs de la plateforme courante : les variantes Linux
      # (@rolldown/binding-linux-*, lightningcss-linux-*) en sont absentes.
      # `npm ci` echoue faute d'un verrou complet, et `npm install` le respecte
      # trop fidelement pour combler le manque. C'est le bug npm/cli#4828, dont
      # la parade documentee est de repartir sans verrou.
      # On perd la verification du verrou en CI. Correctif durable suivi dans le
      # projet GitHub.
      - name: Install
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
