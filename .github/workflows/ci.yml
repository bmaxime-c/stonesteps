name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Le build a besoin de variables presentes, pas valides : aucun appel
      # reseau vers Supabase n'est fait a la compilation.
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install` et non `npm ci` : le verrou est genere sous Windows, ou
      # npm n'inscrit que les binaires natifs de la plateforme courante. Les
      # variantes Linux (@rolldown/binding-linux-*, lightningcss-linux-*) en
      # sont absentes, et `npm ci`, qui exige un verrou complet, echoue.
      # Correctif durable : regenerer le verrou dans un conteneur Linux, puis
      # revenir a `npm ci`. Voir TODO.md.
      - run: npm install --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
